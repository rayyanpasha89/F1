name: Validate project
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit --requirement requirements.runtime.lock --no-deps --disable-pip
      - run: ruff check backend scripts tests
      - run: ruff format --check backend scripts tests
      # Private source and generated model artifacts are intentionally not in Git.
      # Includes synthetic ingestion/rollback, feature leakage, routing and SQL defenses.
      - run: pytest -q -rs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.5"
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/lightsail fmt -check
      - run: terraform -chdir=infra/lightsail init -backend=false
      - run: terraform -chdir=infra/lightsail validate
